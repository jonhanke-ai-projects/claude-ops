# Opt-in. Copy to .github/workflows/claude-implement.yml in a repo that
# should accept "@claude implement this" on its issues.
# All logic lives in jonhanke-ai-projects/claude-ops -- edit there.
name: Claude implement
on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]
concurrency:
  group: claude-implement-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  implement:
    # A called workflow cannot request more permission than its caller holds,
    # and these repos default GITHUB_TOKEN to read-only.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    uses: jonhanke-ai-projects/claude-ops/.github/workflows/claude-implement.yml@main
    # Explicit, not `secrets: inherit` -- inherit does not cross org
    # boundaries and silently passes an empty string instead of failing.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
