# All review logic lives in jonhanke-ai-projects/claude-ops — edit there.
name: Claude auto-review
on:
  pull_request:
    types: [opened, synchronize, labeled]
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    # A called workflow cannot request more permission than its caller holds,
    # and these repos default GITHUB_TOKEN to read-only.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    uses: jonhanke-ai-projects/claude-ops/.github/workflows/claude-review.yml@main
    # Explicit, not `secrets: inherit` — inherit does not cross org boundaries
    # and silently passes an empty string instead of failing.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
